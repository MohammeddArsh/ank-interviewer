services:
  app:
    build: .
    image: ank-voice-assistant:local
    ports:
      - "8000:8000"
    environment:
      MODE: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TEMP_DIR: /tmp
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
    restart: unless-stopped

  # Local inference (fully offline) — optional. Uncomment to test local mode:
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
