services:
  - type: web
    name: ank-voice-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STT_BACKEND
        value: moonshine
      # tiny+quantized keeps peak RSS ~355MB (measured), fitting the 512MB
      # free-tier cap with headroom; base/float needs ~820MB.
      - key: MOONSHINE_MODEL
        value: tiny
      - key: MOONSHINE_PRECISION
        value: quantized
