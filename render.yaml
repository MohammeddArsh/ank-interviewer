services:
  - type: web
    name: ank-voice-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    envVars:
      # Match CI/Docker (py3.13) so dependency pins resolve identically
      # everywhere and Render's default Python can't drift underneath us.
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: OPENROUTER_API_KEY
        sync: false
      # Free-tier models rotate constantly, so we let the app auto-discover the
      # currently-free list at runtime (cached 6h, quality-ordered) instead of
      # pinning slugs that rot. Discovery is bounded by a 20s timeout and runs
      # off the event loop, so it can't stall the health check.
      - key: STT_BACKEND
        value: moonshine
      # tiny+quantized keeps peak RSS ~355MB (measured), fitting the 512MB
      # free-tier cap with headroom; base/float needs ~820MB.
      - key: MOONSHINE_MODEL
        value: tiny
      - key: MOONSHINE_PRECISION
        value: quantized
